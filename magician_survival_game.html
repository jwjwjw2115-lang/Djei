<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}
#wrap{height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px}
#hud{width:min(96vw,900px);display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}
#game{width:min(96vw,900px);height:min(78dvh,720px);background:#243b32;border:3px solid #718096;border-radius:14px;display:block;touch-action:none}
#hint{font-size:12px;color:#cbd5e1;text-align:center}
#overlay{position:fixed;inset:0;background:#0009;display:none;align-items:center;justify-content:center;padding:18px}
.panel{width:min(92vw,540px);background:#1e293b;border:2px solid #a78bfa;border-radius:18px;padding:20px;text-align:center;box-shadow:0 15px 60px #0008}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
.card{background:#334155;color:white;border:1px solid #94a3b8;border-radius:12px;padding:14px 8px;min-height:120px;font-size:14px;font-weight:700}
.card:active{background:#5b21b6}.emoji{font-size:28px;display:block;margin-bottom:8px}.sub{font-size:11px;color:#cbd5e1;font-weight:400;margin-top:6px}
#start{position:fixed;inset:0;background:#111827eF;display:flex;align-items:center;justify-content:center;padding:20px}
button{cursor:pointer}
@media(max-width:520px){#game{height:72dvh}.cards{grid-template-columns:1fr}.card{min-height:70px}.emoji{display:inline;margin-right:8px}}
</style></head>

const heroImg = new Image(); heroImg.src = HERO_SRC;
const c=document.getElementById('game'),ctx=c.getContext('2d');
const W=c.width,H=c.height;
let player,enemies,shots,xps,particles,keys={},running=false,paused=false,last=0,elapsed=0,spawn=0,attack=0,kills=0;
let level=1,xp=0,nextXp=6,stats={damage:24,rate:.72,speed:210,maxHp:100,hp:100,magnet:100,bolt:1};
const choices=[
 {name:'마법 화력 강화',desc:'마법탄 피해량 +35%',icon:'💥',apply:()=>stats.damage*=1.35},
 {name:'연사 마법',desc:'공격 속도 +25%',icon:'⚡',apply:()=>stats.rate*=.8},
 {name:'생명력 강화',desc:'최대 체력 +25, 체력 회복',icon:'❤️',apply:()=>{stats.maxHp+=25;stats.hp=Math.min(stats.maxHp,stats.hp+35)}},
 {name:'마법탄 추가',desc:'동시에 발사하는 탄환 +1',icon:'🔮',apply:()=>stats.bolt=Math.min(5,stats.bolt+1)},
 {name:'신속 강화',desc:'이동 속도 +15%',icon:'👟',apply:()=>stats.speed*=1.15},
 {name:'경험치 자석',desc:'경험치 획득 범위 증가',icon:'🧲',apply:()=>stats.magnet+=65}
];
function reset(){player={x:W/2,y:H/2,r:25,inv:0};enemies=[];shots=[];xps=[];particles=[];elapsed=0;spawn=0;attack=0;kills=0;level=1;xp=0;nextXp=6;stats={damage:24,rate:.72,speed:210,maxHp:100,hp:100,magnet:100,bolt:1};}
function rand(a,b){return a+Math.random()*(b-a)}
function spawnEnemy(boss=false){let side=Math.floor(Math.random()*4),x=side===0?-30:side===1?W+30:rand(0,W),y=side===2?-30:side===3?H+30:rand(0,H);let hp=boss?500:36+elapsed*.9;enemies.push({x,y,r:boss?38:rand(15,22),hp,max:hp,speed:boss?43:rand(48,75)+elapsed*.25,boss});}
function nearest(){let best=null,d=1e9;for(const e of enemies){let q=Math.hypot(e.x-player.x,e.y-player.y);if(q<d){d=q;best=e}}return best}
function shoot(){let target=nearest();if(!target)return;let a=Math.atan2(target.y-player.y,target.x-player.x);for(let i=0;i<stats.bolt;i++){let off=(i-(stats.bolt-1)/2)*.16;let ang=a+off;shots.push({x:player.x,y:player.y,vx:Math.cos(ang)*430,vy:Math.sin(ang)*430,life:1.5,damage:stats.damage,r:7});}}
function levelUp(){level++;paused=true;document.getElementById('overlay').style.display='flex';let pool=[...choices].sort(()=>Math.random()-.5).slice(0,3);let box=document.getElementById('cards');box.innerHTML='';pool.forEach(o=>{let b=document.createElement('button');b.className='card';b.innerHTML=`<span class="emoji">${o.icon}</span>${o.name}<div class="sub">${o.desc}</div>`;b.onclick=()=>{o.apply();paused=false;document.getElementById('overlay').style.display='none';};box.appendChild(b)});}
function addXp(x,y){xps.push({x,y,r:7});}
function update(dt){if(paused||!running)return;elapsed+=dt;spawn+=dt;attack+=dt;player.inv=Math.max(0,player.inv-dt);
 let dx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.a?1:0),dy=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.w?1:0);
 if(pointer.active){dx=pointer.dx;dy=pointer.dy;}
 let len=Math.hypot(dx,dy)||1;player.x=Math.max(28,Math.min(W-28,player.x+dx/len*stats.speed*dt));player.y=Math.max(50,Math.min(H-35,player.y+dy/len*stats.speed*dt));
 if(spawn>Math.max(.35,1.35-elapsed*.008)){spawn=0;spawnEnemy();if(elapsed>60&&Math.floor(elapsed)%60===0)spawnEnemy(true);}
 if(attack>stats.rate){attack=0;shoot();}
 for(let e of enemies){let a=Math.atan2(player.y-e.y,player.x-e.x);e.x+=Math.cos(a)*e.speed*dt;e.y+=Math.sin(a)*e.speed*dt;if(Math.hypot(e.x-player.x,e.y-player.y)<e.r+player.r-7&&player.inv<=0){stats.hp-=e.boss?18:10;player.inv=.65;if(stats.hp<=0){gameOver();return}}}
 for(let s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;for(let e of enemies){if(!s.hit&&Math.hypot(s.x-e.x,s.y-e.y)<e.r+s.r){e.hp-=s.damage;s.hit=true;for(let k=0;k<5;k++)particles.push({x:s.x,y:s.y,vx:rand(-60,60),vy:rand(-60,60),life:.25});}}}
 shots=shots.filter(s=>s.life>0&&!s.hit);
 let dead=enemies.filter(e=>e.hp<=0);for(let e of dead){kills++;addXp(e.x,e.y);if(e.boss){for(let i=0;i<12;i++)addXp(e.x+rand(-40,40),e.y+rand(-40,40));}}enemies=enemies.filter(e=>e.hp>0);
 for(let g of xps){let d=Math.hypot(player.x-g.x,player.y-g.y);if(d<stats.magnet){g.x+=(player.x-g.x)*Math.min(1,dt*4);g.y+=(player.y-g.y)*Math.min(1,dt*4);}if(d<player.r+g.r+5)g.got=true;}
 let got=xps.filter(g=>g.got).length;xps=xps.filter(g=>!g.got);xp+=got;while(xp>=nextXp){xp-=nextXp;nextXp=Math.floor(nextXp*1.32+2);levelUp();}
 particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);
 document.getElementById('level').textContent='LV. '+level+' · XP '+xp+'/'+nextXp;document.getElementById('time').textContent=fmt(elapsed);document.getElementById('kills').textContent='처치 '+kills;document.getElementById('hp').textContent='❤️ '+Math.ceil(stats.hp);
}
function fmt(t){return String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0')}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#315642';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#ffffff12';ctx.lineWidth=1;for(let x=0;x<W;x+=45){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=45){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 for(let g of xps){ctx.fillStyle='#67e8f9';ctx.beginPath();ctx.arc(g.x,g.y,g.r,0,7);ctx.fill();ctx.strokeStyle='#e0f2fe';ctx.stroke()}
 for(let s of shots){ctx.fillStyle='#fde047';ctx.shadowColor='#fef08a';ctx.shadowBlur=12;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,7);ctx.fill();ctx.shadowBlur=0}
 for(let e of enemies){ctx.fillStyle=e.boss?'#7c2d12':'#9f1239';ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(e.x-e.r*.3,e.y-4,3,0,7);ctx.arc(e.x+e.r*.3,e.y-4,3,0,7);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2,4);ctx.fillStyle='#ef4444';ctx.fillRect(e.x-e.r,e.y-e.r-9,e.r*2*Math.max(0,e.hp/e.max),4);if(e.boss){ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.fillText('BOSS',e.x-18,e.y-e.r-16)}}
 for(let p of particles){ctx.fillStyle='#fbbf24';ctx.globalAlpha=Math.max(0,p.life/.25);ctx.fillRect(p.x,p.y,4,4);ctx.globalAlpha=1}
 if(heroImg.complete&&heroImg.naturalWidth){let iw=78,ih=105;ctx.save();if(player.inv>0&&Math.floor(player.inv*16)%2===0)ctx.globalAlpha=.5;ctx.drawImage(heroImg,player.x-iw/2,player.y-ih/2,iw,ih);ctx.restore();}
 else {ctx.fillStyle='#facc15';ctx.beginPath();ctx.arc(player.x,player.y,player.r,0,7);ctx.fill()}
 requestAnimationFrame(draw);
}
function gameOver(){running=false;document.getElementById('overlay').style.display='flex';document.querySelector('#overlay .panel').innerHTML=`<h2>게임 종료</h2><p>생존 시간 ${fmt(elapsed)} · 처치 ${kills}</p><button onclick="location.reload()" style="padding:12px 22px;border:0;border-radius:10px;background:#8b5cf6;color:white;font-weight:800">다시 시작</button>`;}
const pointer={active:false,dx:0,dy:0};
c.addEventListener('pointerdown',e=>{pointer.active=true;pointer.sx=e.offsetX;pointer.sy=e.offsetY;c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!pointer.active)return;let dx=e.offsetX-pointer.sx,dy=e.offsetY-pointer.sy,l=Math.hypot(dx,dy);pointer.dx=l?dx/Math.max(35,l):0;pointer.dy=l?dy/Math.max(35,l):0;});
c.addEventListener('pointerup',()=>{pointer.active=false;pointer.dx=pointer.dy=0});
window.addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault()});
window.addEventListener('keyup',e=>keys[e.key]=false);
document.getElementById('begin').onclick=()=>{document.getElementById('start').style.display='none';reset();running=true;last=performance.now();requestAnimationFrame(loop)};
function loop(t){let dt=Math.min(.04,(t-last)/1000);last=t;update(dt);requestAnimationFrame(loop)}
draw();
</script></body></html>
